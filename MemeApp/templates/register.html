<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemeSite - Реєстрація</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 50%, #2d2d2d 100%);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .star {
            position: absolute;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0% {
                opacity: 0.3;
                background-color: #ffffff;
                box-shadow: 0 0 5px #ffffff;
            }
            25% {
                opacity: 0.7;
                background-color: #fffacd;
                box-shadow: 0 0 8px #fffacd;
            }
            50% {
                opacity: 1;
                background-color: #ffeb3b;
                box-shadow: 0 0 12px #ffeb3b, 0 0 20px #ffeb3b;
            }
            75% {
                opacity: 0.7;
                background-color: #fffacd;
                box-shadow: 0 0 8px #fffacd;
            }
            100% {
                opacity: 0.3;
                background-color: #ffffff;
                box-shadow: 0 0 5px #ffffff;
            }
        }

        .container {
            background: transparent;
            position: relative;
            z-index: 1;
        }

        h1, p, .navbar-brand, .nav-link, label {
            color: white !important;
        }

        .auth-card {
            background-color: rgba(42, 42, 42, 0.9);
            border: 1px solid #444;
            border-radius: 15px;
            backdrop-filter: blur(5px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .form-control {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
        }

        .form-control:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffeb3b;
            box-shadow: 0 0 10px rgba(255, 235, 59, 0.3);
            color: white;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .nav-link {
            background: rgba(255, 255, 255, 0.1);
            margin: 5px;
            border-radius: 8px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .nav-link:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
        }

        .alert {
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>

    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{% url 'MemeApp:home' %}">🎭 MemeSite 🎭</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="{% url 'MemeApp:login' %}">🔑 Вхід</a>
                <a class="nav-link" href="{% url 'MemeApp:home' %}">🏠 Головна</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="auth-card p-4">
                    <h1 class="text-center mb-4">📝 Реєстрація</h1>

                    {% if messages %}
                        <div class="alert alert-danger">
                            {% for message in messages %}
                                <div class="mb-2">{{ message }}</div>
                            {% endfor %}
                        </div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        {{ form.as_p }}

                        <button type="submit" class="btn btn-primary w-100 py-2 mb-3">Зареєструватися</button>

                        <div class="text-center">
                            <p class="text-white">Вже є акаунт? <a href="{% url 'MemeApp:login' %}" class="text-warning">Увійти</a></p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        function createStars() {
            const starsContainer = document.getElementById('stars');
            const starCount = 150;

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';

                const size = Math.random() * 3 + 1;
                star.style.width = size + 'px';
                star.style.height = size + 'px';

                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';

                const duration = Math.random() * 4 + 2;
                star.style.animationDuration = duration + 's';

                star.style.animationDelay = Math.random() * 5 + 's';

                starsContainer.appendChild(star);
            }
        }

        document.addEventListener('DOMContentLoaded', createStars);
    </script>
</body>
</html>
